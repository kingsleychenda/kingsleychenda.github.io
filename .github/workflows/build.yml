name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A08381: ${{ secrets.A08381 }}
          B7E6E7: ${{ secrets.B7E6E7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A08381', '')
          k2 = os.environ.get('B7E6E7', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 7a4457a9e746d8261354af242477dfd8aef497cd93ef8935 -->', k1) if k1 else txt
          out = out.replace('<!-- 83a38f315787ba78910fc890 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
